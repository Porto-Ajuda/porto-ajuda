<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../styles/perfil.css">
    <link rel="stylesheet" href="../styles/geral.css">

    <script src="../components/perfil.js" defer></script>
    <script src="../components/header_footer.js" defer></script>
</head>

<body>

    <header class="navbar"></header>

    <main>

        <!-- ========================= -->
        <!-- PERFIL -->
        <!-- ========================= -->

        <div class="perfil-header">

            <div class="rectangle">

                <!-- FOTO DE PERFIL -->
                <div class="circle">
                    <img 
                        src="../assets/user-gold.png" 
                        id="circle-default-img" 
                        alt="Foto de perfil"
                    >
                </div>


                <!-- INFORMAÇÕES DO PERFIL -->
                <div class="info-perfil">

                    <label for="nome">Nome</label>
                    <input 
                        type="text" 
                        id="nome" 
                        disabled
                    >

                    <label for="nomeSc">Nome Social</label>
                    <input 
                        type="text" 
                        id="nomeSc" 
                        disabled
                    >

                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        disabled
                    >

                    <label for="telefone">Telefone</label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        disabled
                    >

                    <!-- SENHA -->
                    <label for="senha" class="campo-senha">
                        Senha
                    </label>

                    <input 
                        type="password" 
                        id="senha" 
                        class="campo-senha" 
                        disabled
                    >

                </div>


                <!-- BOTÃO ALTERAR DADOS -->
                <section class="Alterar-dados">

                    <button 
                        type="button" 
                        id="btn"
                    >
                        Alterar Dados
                    </button>

                </section>

            </div>

        </div>


        <!-- ========================= -->
        <!-- CONTAINER DOS CARDS -->
        <!-- ========================= -->

        <div class="cards-container">


            <!-- ========================= -->
            <!-- CARD 1 - DADOS DO USUÁRIO -->
            <!-- ========================= -->

            <section class="dados-do-usuario card">

                <div class="card-header">

                    <span class="titulo">
                        Dados do Usuário
                    </span>

                    <button 
                        type="button" 
                        class="btn-seta"
                    >
                        <img 
                            src="../assets/arrow-down.png" 
                            alt="Expandir" 
                            class="seta-baixo"
                        >
                    </button>

                </div>


                <div class="detalhes-usuario">

                    <label for="CEP">CEP</label>
                    <input 
                        type="text" 
                        id="CEP" 
                        disabled
                    >

                    <label for="CPF">CPF</label>
                    <input 
                        type="text" 
                        id="CPF" 
                        disabled
                    >

                    <label for="nascimento">
                        Data de Nascimento
                    </label>

                    <input 
                        type="date" 
                        id="nascimento" 
                        disabled
                    >

                    <label for="genero">Gênero</label>
                    <input 
                        type="text" 
                        id="genero" 
                        disabled
                    >

                </div>

            </section>


            <!-- ========================= -->
            <!-- CARD 2 - ACESSIBILIDADE -->
            <!-- ========================= -->

            <section class="dados-de-acessibilidade card">

                <div class="card-header">

                    <span class="titulo">
                        Acessibilidade
                    </span>

                    <button 
                        type="button" 
                        class="btn-seta"
                    >
                        <img 
                            src="../assets/arrow-down.png" 
                            alt="Expandir" 
                            class="seta-baixo"
                        >
                    </button>

                </div>


                <div class="detalhes-acessibilidade">

                    <label for="libra">
                        LIBRAS
                    </label>

                    <button 
                        id="libra" 
                        class="toggle" 
                        type="button"
                    >
                        <span class="toggle-circle"></span>
                    </button>


                    <label for="contraste">
                        ALTO-CONTRASTE
                    </label>

                    <button 
                        id="contraste" 
                        class="toggle" 
                        type="button"
                    >
                        <span class="toggle-circle"></span>
                    </button>


                    <label for="letra">
                        LETRA GRANDE
                    </label>

                    <button 
                        id="letra" 
                        class="toggle" 
                        type="button"
                    >
                        <span class="toggle-circle"></span>
                    </button>

                </div>

            </section>


            <!-- ========================= -->
            <!-- CARD 3 - CONFIGURAÇÕES -->
            <!-- ========================= -->

            <section class="configuracoes card">

                <div class="card-header">

                    <span class="titulo">
                        Configurações
                    </span>

                    <button 
                        type="button" 
                        class="btn-seta"
                    >
                        <img 
                            src="../assets/arrow-down.png" 
                            alt="Expandir" 
                            class="seta-baixo"
                        >
                    </button>

                </div>


                <div class="detalhes-configuracoes">

                    <!-- IDIOMA -->

                    <label for="idioma">
                        IDIOMA
                    </label>

                    <input 
                        type="text" 
                        id="idioma" 
                        class="Ulang" 
                        value="" 
                        disabled
                    >


                    <!-- CONTA -->

                    <label for="conta">
                        CONTA
                    </label>

                    <div class="botoes-conta">

                        <button 
                            type="button" 
                            class="btn-osc"
                        >
                            OSC
                        </button>

                        <button 
                            type="button" 
                            class="btn-out"
                        >
                            Sair
                        </button>

                    </div>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
