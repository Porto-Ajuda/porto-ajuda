<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porto Ajuda – Sobre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../styles/ong-profile.css" />
  <link rel="stylesheet" href="../styles/geral.css">
  <script src="../components/header_footer.js" defer></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const elementosSurgir = document.querySelectorAll(".surgir");

      const observador = new IntersectionObserver((entradas) => {
        entradas.forEach(entrada => {
          if (entrada.isIntersecting) {
            entrada.target.classList.add("active");
          }
        });
      }, { threshold: 0.15 });

      elementosSurgir.forEach(el => observador.observe(el));

    });
  </script>
</head>
<body>



  <!-- ========================= -->
  <!-- NAVBAR -->
  <!-- ========================= -->

  <header class="navbar"></header>
<div class="stars"></div>

  <section class="surgir">

  

  </section>

  <!-- ========================= -->
  <!-- DIVISOR -->
  <!-- ========================= -->

  <section class="destaque">
    <div class="divider">
      <img class="lua1" src="../assets/moon.png" alt="">
    </div>
  </section>

  <section class="surgir">


  </section>
 
  <footer id="footer"></footer>

</body>
</html>
