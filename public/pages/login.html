<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Porto Ajuda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/geral.css">

    <script src="../components/login.js" defer></script>
    <script src="../components/header_footer.js" defer></script>
</head>

<body>

    <header class="navbar"></header>
    <div class="moon">
    </div>
    <div class="polygon">
        <div class="shape">
            <img src="../assets/moon.png" alt="lua" id="moonT">
        </div>
    </div>


    <div class="frame" id="frame">


        <div class="panel panel-login">

            <div class="form-sec">

                <h1 class="title">
                    Porto <span>Ajuda</span>
                </h1>

                <p class="subtitulo">
                    Pequenas ações podem transformar vidas.<br>
                    Faça login e continue ajudando.
                </p>

                <form class="formulario" autocomplete="off">

                    <input class="inp" type="text" placeholder="CPF" autocomplete="off" maxlength="14">

                    <div class="campo-senha">
                        <input id="senha" class="inp" type="password" placeholder="Senha">
                        <button type="button" id="mostrar-senha">👁️</button>
                    </div>

                    <button class="btn" type="submit">
                        Fazer Login
                    </button>

                </form>

                <p class="sw">
                    Ainda não possui uma conta?
                    <a id="goCad">Cadastre-se</a>
                </p>

            </div>


        </div>

        <div class="panel panel-cadastro">

            <div class="form-sec">

                <h1 class="title">
                    Criar <span>Conta</span>
                </h1>

                <p class="subtitulo">
                    Junte-se à comunidade Porto Ajuda<br>
                    e faça parte dessa transformação.
                </p>

                <form class="formulario" autocomplete="off">

                    <!-- ETAPA 1 -->
                    <div class="row2">

                        <input class="inp" type="text" placeholder="Nome">

                        <input class="inp" id="cpf" type="text" placeholder="CPF" maxlength="14" autocomplete="off">

                        <input class="inp" type="email" placeholder="E-mail">

                    </div>

                    <!-- ETAPA 2 -->
                    <div class="row3">

                        <input class="inp" type="tel" id="telefone" placeholder="Telefone">

                        <input class="inp" type="text" id="username" placeholder="Nome de usuário">

                        <input class="inp" type="text" id="nascimento" placeholder="Data de nascimento"
                            onfocus="this.type='date'" onblur="if(!this.value) this.type='text'">

                        <input class="inp" type="text" id="cep" placeholder="CEP" autocomplete="off">

                    </div>

                    <!-- ETAPA 3 -->
                    <div class="row4">

                        <input class="inp" type="password" placeholder="Senha">

                        <input class="inp" type="password" placeholder="Confirmar Senha">

                        <div class="opcoes">

                            <h2>Ao se cadastrar neste site, você afirma que</h2>

                            <label>
                                <input id="check-termos" type="checkbox" name="termos"                                    value="aceito" required>
                                Concorda com nossos
                                <button class="open-modal style-open-modal" data-modal="modal-termos"
                                    type="button">Termos de Uso</button>
                                e nossas políticas de
                                <button class="open-modal style-open-modal" data-modal="modal-lgpd"
                                    type="button">Privacidade &amp; Uso de Dados</button>
                            </label>

                        </div>

                    </div>

                    <button class="btn" type="button" id="nextBtn">
                        Próximo
                    </button>

                    <button class="btn" type="submit" id="cad">
                        Cadastrar
                    </button>

                </form>

                <p class="sw">
                    Já possui uma conta?
                    <a id="goLogin">Entrar</a>
                </p>

            </div>
        </div>
</body>

</html>
