<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login da OSC | Porto Ajuda</title>

    <link rel="stylesheet" href="../styles/cadastro-osc.css">
    <link rel="stylesheet" href="../styles/login-osc.css">
    <link rel="stylesheet" href="../styles/geral.css">
    <link rel="stylesheet" href="../styles/acessibilidade.css">

    <script src="../components/login-osc.js" defer></script>
    <script src="../components/header_footer.js" defer></script>
    <script src="../components/acessibilidade.js" defer></script>
</head>

<body>

    <div class="stars"></div>
    <header class="navbar"></header>

    <div class="polygon">
        <div class="shape">
            <h1 class="title">Porto <span>Ajuda</span></h1>
            <p class="subtitulo">
                Acesse a conta da sua OSC e gerencie as suas <span>iniciativas sociais</span>.
            </p>
        </div>
    </div>

    <div class="frame frame-login" id="frame">
        <div class="panel">

            <form id="form-login-osc" class="form-login-osc" novalidate>

                <h2>Entrar</h2>
                <p class="descricao-etapa">Use o CNPJ e a senha cadastrados para acessar a conta da OSC.</p>

                <div class="campo">
                    <label for="login-cnpj">CNPJ</label>
                    <input type="text" id="login-cnpj" name="cnpj" placeholder="00.000.000/0000-00" maxlength="18" inputmode="numeric" autocomplete="username" required>
                </div>

                <div class="campo">
                    <label for="login-senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="login-senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" class="btn-olho" data-alvo="login-senha" aria-label="Mostrar senha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="links-login links-login-direita">
                    <a href="recuperar-senha.html">Esqueci minha senha</a>
                </div>

                <p class="msg-error msg-login" id="erro-login" role="alert" hidden></p>

                <button type="submit" class="botao botao-cadastrar botao-entrar" id="btn-entrar">Entrar</button>

                <div class="links-login">
                    Ainda não tem cadastro? <a href="cadastro-osc.html">Cadastrar OSC</a>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
