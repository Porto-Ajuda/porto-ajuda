spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.open-in-view=false

server.port=${PORT:8080}

logging.level.org.hibernate.tool.schema=INFO
logging.level.org.hibernate.orm.connections.pooling=OFF
logging.level.com.zaxxer.hikari=OFF


ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

app.frontend-url=${APP_FRONTEND_URL}
app.backend-url=${APP_BACKEND_URL}

app.cookies.secure=${APP_COOKIES_SECURE:true}
    
# Resend - envio de e-mails pela API HTTPS
RESEND_API_KEY=${RESEND_API_KEY}
MAIL_FROM=${MAIL_FROM}
MAIL_TO=${MAIL_TO:}

# SMS Mais. Sandbox e produção usam o mesmo endpoint; o token sbx_ não entrega SMS.
smsmais.token=${SMSMAIS_TOKEN:}
smsmais.environment=${SMSMAIS_ENVIRONMENT:sandbox}
smsmais.connect-timeout=${SMSMAIS_CONNECT_TIMEOUT:3s}
smsmais.read-timeout=${SMSMAIS_READ_TIMEOUT:5s}

# Pepper aleatório de pelo menos 32 caracteres, exclusivo para desafios admin.
admin-auth.code-pepper=${ADMIN_AUTH_CODE_PEPPER:}
admin-auth.delivery-poll-ms=${ADMIN_AUTH_DELIVERY_POLL_MS:1000}
app.security.railway-public-edge-enabled=${RAILWAY_PUBLIC_EDGE_IP_HEADER_ENABLED:false}
app.admin.rbac.enforcement-enabled=${ADMIN_RBAC_ENFORCEMENT_ENABLED:false}
app.password-recovery.pepper=${PASSWORD_RECOVERY_PEPPER:}

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require

# Inicializadores de escrita e limpeza agendada são desabilitados por padrão.
app.initialization.seed-roles=${APP_INITIALIZATION_SEED_ROLES:false}
app.maintenance.cleanup-cron=${APP_MAINTENANCE_CLEANUP_CRON:-}

# Supabase Storage - upload de imagens
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket-publico=${SUPABASE_BUCKET_PUBLICO}

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Tomcat
server.tomcat.max-swallow-size=10MB

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
