
spring.config.import=optional:file:../.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false

server.port=${PORT:8080}

logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.orm=DEBUG
logging.level.org.springframework.security=TRACE

ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

app.frontend-url=${APP_FRONTEND_URL:https://www.portoajuda.com.br}

app.cookies.secure=${APP_COOKIES_SECURE:true}
    
# Resend - envio de e-mails pela API HTTPS
RESEND_API_KEY=${RESEND_API_KEY}
MAIL_FROM=${MAIL_FROM}
MAIL_TO=${MAIL_TO:}

# Banco de dados
spring.datasource.url=${DB_REMOTE_URL}
spring.datasource.username=${DB_REMOTE_USER}
spring.datasource.password=${DB_REMOTE_PASSWORD}

# Supabase Storage - upload de imagens
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket-publico=${SUPABASE_BUCKET_PUBLICO:imagens-publicas}

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tomcat
server.tomcat.max-swallow-size=10MB