spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
logging.file.name=${LOGGING_FILE_NAME:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.open-in-view=false

server.port=${PORT:8080}

logging.level.org.hibernate.tool.schema=INFO
logging.level.org.hibernate.orm.connections.pooling=OFF
logging.level.com.zaxxer.hikari=OFF


ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

app.frontend-url=${APP_FRONTEND_URL}
app.backend-url=${APP_BACKEND_URL}

app.cookies.secure=${APP_COOKIES_SECURE:true}
    
# Resend - envio de e-mails pela API HTTPS
RESEND_API_KEY=${RESEND_API_KEY}
MAIL_FROM=${MAIL_FROM}
MAIL_TO=${MAIL_TO:}

# SMS Mais. Sandbox e produção usam o mesmo endpoint; o token sbx_ não entrega SMS.
smsmais.token=${SMSMAIS_TOKEN:}
smsmais.environment=${SMSMAIS_ENVIRONMENT:sandbox}
smsmais.connect-timeout=${SMSMAIS_CONNECT_TIMEOUT:3s}
smsmais.read-timeout=${SMSMAIS_READ_TIMEOUT:5s}

# Pepper aleatório de pelo menos 32 caracteres, exclusivo para desafios admin.
admin-auth.code-pepper=${ADMIN_AUTH_CODE_PEPPER:}
admin-auth.sms-verification-enabled=${ADMIN_SMS_VERIFICATION_ENABLED:true}
admin-auth.delivery-poll-ms=${ADMIN_AUTH_DELIVERY_POLL_MS:1000}
admin-auth.sandbox-code-access-enabled=${ADMIN_AUTH_SANDBOX_CODE_ACCESS_ENABLED:false}
app.security.railway-public-edge-enabled=${RAILWAY_PUBLIC_EDGE_IP_HEADER_ENABLED:false}
app.admin.rbac.enforcement-enabled=${ADMIN_RBAC_ENFORCEMENT_ENABLED:false}
app.password-recovery.pepper=${PASSWORD_RECOVERY_PEPPER:}
app.content-reporting.enabled=${CONTENT_REPORTING_ENABLED:false}
app.content-reporting.publication-threshold=${CONTENT_REPORT_PUBLICATION_THRESHOLD:5}
app.content-reporting.volunteer-threshold=${CONTENT_REPORT_VOLUNTEER_THRESHOLD:5}
app.content-reporting.organization-threshold=${CONTENT_REPORT_ORGANIZATION_THRESHOLD:10}
app.content-reporting.publication-window-hours=${CONTENT_REPORT_PUBLICATION_WINDOW_HOURS:24}
app.content-reporting.volunteer-window-hours=${CONTENT_REPORT_VOLUNTEER_WINDOW_HOURS:24}
app.content-reporting.organization-window-hours=${CONTENT_REPORT_ORGANIZATION_WINDOW_HOURS:48}
app.moderation.points.enabled=${MODERATION_POINTS_ENABLED:false}

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require

# Inicializadores de escrita e limpeza agendada são desabilitados por padrão.
app.initialization.seed-roles=${APP_INITIALIZATION_SEED_ROLES:false}
app.maintenance.cleanup-cron=${APP_MAINTENANCE_CLEANUP_CRON:-}

# Supabase Storage - upload de imagens
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket-publico=${SUPABASE_BUCKET_PUBLICO}
app.ngo-verification.enabled=${NGO_VERIFICATION_ENABLED:false}
app.ngo-verification.ai-analysis.enabled=${NGO_VERIFICATION_AI_ANALYSIS_ENABLED:false}
app.ngo-verification.ai-analysis.results-read-enabled=${NGO_VERIFICATION_AI_RESULTS_READ_ENABLED:false}
app.ngo-verification.ai-analysis.worker-enabled=${NGO_VERIFICATION_AI_WORKER_ENABLED:false}
app.ngo-verification.ai-analysis.evaluation-worker-enabled=${NGO_VERIFICATION_AI_EVALUATION_WORKER_ENABLED:false}
app.ngo-verification.ai-analysis.evaluation-poll-ms=${NGO_VERIFICATION_AI_EVALUATION_POLL_MS:250}
app.ngo-verification.ai-analysis.evaluation-max-provider-requests=${NGO_VERIFICATION_AI_EVALUATION_MAX_REQUESTS:3}
app.ngo-verification.ai-analysis.provider=${NGO_VERIFICATION_AI_PROVIDER:none}
app.ngo-verification.ai-analysis.model=${NGO_VERIFICATION_AI_MODEL:gpt-6.1-terra}
app.ngo-verification.ai-analysis.poll-ms=${NGO_VERIFICATION_AI_POLL_MS:5000}
app.ngo-verification.ai-analysis.timeout=${NGO_VERIFICATION_AI_TIMEOUT:30s}
app.ngo-verification.ai-analysis.validity-zone=${NGO_VERIFICATION_VALIDITY_ZONE:America/Sao_Paulo}
app.ngo-verification.ai-analysis.lease=${NGO_VERIFICATION_AI_LEASE:90s}
app.ngo-verification.ai-analysis.max-total-bytes=${NGO_VERIFICATION_AI_MAX_TOTAL_BYTES:31457280}
app.ngo-verification.ai-analysis.max-pages=${NGO_VERIFICATION_AI_MAX_PAGES:40}
app.ngo-verification.ai-analysis.max-output-tokens=${NGO_VERIFICATION_AI_MAX_OUTPUT_TOKENS:2000}
gemini.api-key=${GEMINI_API_KEY:}
app.ngo-verification.ai-analysis.gemini.requests-per-minute=${NGO_VERIFICATION_GEMINI_RPM:10}
app.ngo-verification.ai-analysis.gemini.input-tokens-per-minute=${NGO_VERIFICATION_GEMINI_TPM:200000}
app.ngo-verification.ai-analysis.gemini.requests-per-day=${NGO_VERIFICATION_GEMINI_RPD:450}
app.ngo-verification.ai-analysis.gemini.estimated-tokens-per-pdf-page=${NGO_VERIFICATION_GEMINI_EST_TOKENS_PER_PDF_PAGE:3000}
app.ngo-verification.ai-analysis.gemini.estimated-tokens-per-image=${NGO_VERIFICATION_GEMINI_EST_TOKENS_PER_IMAGE:16000}
app.ngo-verification.auto-approval.enabled=${NGO_VERIFICATION_AUTO_APPROVAL_ENABLED:false}
app.support-assistant.enabled=${SUPPORT_ASSISTANT_ENABLED:false}
app.support-assistant.retention-worker.enabled=${SUPPORT_ASSISTANT_RETENTION_WORKER_ENABLED:false}
app.support-assistant.ai.enabled=${SUPPORT_ASSISTANT_AI_ENABLED:false}
app.support-assistant.display-name=${SUPPORT_ASSISTANT_DISPLAY_NAME:Sophie}
app.support-assistant.ai.provider=${SUPPORT_ASSISTANT_AI_PROVIDER:none}
app.support-assistant.ai.model=${SUPPORT_ASSISTANT_AI_MODEL:${NGO_VERIFICATION_AI_MODEL:gemini-3.1-flash-lite}}
app.support-assistant.ai.timeout=${SUPPORT_ASSISTANT_AI_TIMEOUT:20s}
app.support-assistant.ai.max-input-characters=${SUPPORT_ASSISTANT_AI_MAX_INPUT_CHARACTERS:12000}
app.support-assistant.rate-limit-per-minute=${SUPPORT_ASSISTANT_RATE_LIMIT_PER_MINUTE:12}
app.support-assistant.retention-poll-ms=${SUPPORT_ASSISTANT_RETENTION_POLL_MS:60000}
supabase.bucket-verificacao=${SUPABASE_BUCKET_VERIFICACAO:ngo-representative-evidence}
cnpja.url-base=${CNPJA_URL_BASE:https://open.cnpja.com/office/}

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Tomcat
server.tomcat.max-swallow-size=10MB

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
